<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindServices Order Detail Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .placeholder-image {
            background-image: repeating-linear-gradient(
                45deg,
                #e5e7eb,
                #e5e7eb 10px,
                #f3f4f6 10px,
                #f3f4f6 20px
            );
        }
        .placeholder-map {
            background-color: #e5e7eb;
            background-image: 
                linear-gradient(#d1d5db 2px, transparent 2px),
                linear-gradient(90deg, #d1d5db 2px, transparent 2px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-600 font-mono">

    <!-- NAVBAR WIREFRAME -->
    <nav class="bg-white border-b border-gray-300 fixed w-full z-50 top-0 h-16">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            
            <!-- Kiri: Logo & Search -->
            <div class="flex items-center gap-4 w-1/3">
                <div class="h-10 w-10 bg-gray-400 rounded-full flex items-center justify-center text-white text-xs">LOGO</div>
                <div class="hidden md:block w-full max-w-xs h-9 bg-gray-200 rounded-full border border-gray-300"></div>
            </div>

            <!-- Tengah: Navigasi (Icon ke-3 Aktif - Pesanan) -->
            <div class="flex justify-center flex-1 gap-8 h-full items-end pb-0">
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <!-- Menu Pesanan Aktif -->
                <div class="h-full flex flex-col justify-end items-center gap-3 pt-4 border-b-4 border-gray-600 px-2">
                    <div class="h-8 w-8 bg-gray-600 rounded"></div>
                </div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
            </div>

            <!-- Kanan: Profil -->
            <div class="flex items-center justify-end w-1/3 gap-3">
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-400 rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 pt-24 pb-10">
        
        <!-- Header Page -->
        <div class="mb-6">
            <div class="flex items-center gap-2 mb-2">
                <div class="h-4 w-4 bg-gray-400 rounded-full"></div> <!-- Arrow Back Icon -->
                <div class="h-4 w-48 bg-gray-400 rounded"></div> <!-- Link "Kembali ke..." -->
            </div>
            <div class="h-8 w-64 bg-gray-800 rounded"></div> <!-- Title "Detail Pesanan #k55" -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- KOLOM KIRI (Detail Pengerjaan) -->
            <div class="lg:col-span-8 space-y-6">
                
                <!-- Card 1: Lokasi Pengerjaan -->
                <section class="bg-white border border-gray-300 rounded-lg p-6">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="h-6 w-6 bg-gray-600 rounded"></div> <!-- Icon Map -->
                        <div class="h-5 w-40 bg-gray-700 rounded"></div> <!-- Title -->
                    </div>
                    
                    <!-- Map Placeholder -->
                    <div class="w-full h-64 placeholder-map rounded-lg relative mb-4 border border-gray-200">
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                            <div class="h-10 w-10 bg-gray-700 rounded-full border-4 border-white shadow-lg flex items-center justify-center">
                                <div class="h-3 w-3 bg-white rounded-full"></div>
                            </div>
                        </div>
                        <!-- Popover Address on Map -->
                        <div class="absolute top-1/3 left-1/2 transform -translate-x-1/2 bg-white p-3 rounded shadow-md border border-gray-200 text-xs w-64">
                            <div class="h-3 w-full bg-gray-400 rounded mb-1"></div>
                            <div class="h-3 w-3/4 bg-gray-300 rounded"></div>
                        </div>
                    </div>

                    <!-- Alamat Text -->
                    <div class="flex gap-2 text-sm">
                        <span class="font-bold">Alamat:</span>
                        <div class="h-4 w-full bg-gray-200 rounded"></div>
                    </div>
                </section>

                <!-- Card 2: Jadwal & Catatan -->
                <section class="bg-white border border-gray-300 rounded-lg p-6">
                    <div class="flex items-center gap-2 mb-6">
                        <div class="h-6 w-6 bg-gray-600 rounded"></div> <!-- Icon Calendar -->
                        <div class="h-5 w-40 bg-gray-700 rounded"></div> <!-- Title -->
                    </div>

                    <div class="grid grid-cols-2 gap-8 mb-6">
                        <div>
                            <div class="h-3 w-16 bg-gray-400 rounded mb-2"></div> <!-- Label Tanggal -->
                            <div class="h-5 w-40 bg-gray-600 rounded"></div> <!-- Value Tanggal -->
                        </div>
                        <div>
                            <div class="h-3 w-10 bg-gray-400 rounded mb-2"></div> <!-- Label Jam -->
                            <div class="h-5 w-24 bg-gray-600 rounded"></div> <!-- Value Jam -->
                        </div>
                    </div>

                    <div>
                        <div class="h-3 w-40 bg-gray-400 rounded mb-2"></div> <!-- Label Catatan -->
                        <div class="bg-gray-50 border border-gray-200 rounded p-4 italic text-gray-400">
                            "Catatan tambahan."
                        </div>
                    </div>
                </section>

                <!-- Card 3: Snippet Service (Bottom) -->
                <section class="bg-white border border-gray-300 rounded-lg p-4 flex gap-4 items-center">
                     <div class="h-16 w-16 bg-gray-300 rounded"></div>
                     <div class="space-y-2">
                        <div class="h-4 w-32 bg-gray-700 rounded"></div>
                        <div class="h-3 w-24 bg-gray-400 rounded"></div>
                     </div>
                </section>

            </div>

            <!-- KOLOM KANAN (Sidebar Status & Biaya) -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- Widget 1: Rincian Biaya -->
                <div class="bg-white border border-gray-300 rounded-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <div class="h-5 w-32 bg-gray-800 rounded"></div> <!-- Title Rincian -->
                        <div class="h-5 w-16 bg-yellow-200 rounded text-xs flex items-center justify-center text-yellow-800 font-bold">ESTIMASI</div>
                    </div>

                    <!-- List Biaya -->
                    <div class="space-y-3 mb-4 border-b border-gray-200 pb-4">
                        <div class="flex justify-between">
                            <div class="h-4 w-24 bg-gray-400 rounded"></div>
                            <div class="h-4 w-20 bg-gray-600 rounded"></div>
                        </div>
                        <div class="flex justify-between">
                            <div class="h-4 w-32 bg-gray-400 rounded"></div>
                            <div class="h-4 w-20 bg-gray-600 rounded"></div>
                        </div>
                        <div class="flex justify-between">
                            <div class="h-4 w-20 bg-gray-400 rounded"></div>
                            <div class="h-4 w-16 bg-gray-600 rounded"></div>
                        </div>
                    </div>

                    <!-- Total -->
                    <div class="flex justify-between items-center mb-6">
                        <div class="h-5 w-24 bg-gray-800 rounded"></div>
                        <div class="h-6 w-28 bg-blue-600 rounded"></div>
                    </div>

                    <!-- Metode Bayar -->
                    <div class="flex justify-between items-center mb-6">
                        <div class="h-4 w-24 bg-gray-500 rounded"></div>
                        <div class="flex items-center gap-2">
                            <div class="h-4 w-32 bg-gray-800 rounded"></div>
                            <div class="h-4 w-4 bg-blue-400 rounded"></div> <!-- Bank Icon -->
                        </div>
                    </div>

                    <!-- Warning Box (Kuning) -->
                    <div class="bg-yellow-50 border border-yellow-200 rounded p-4 mb-4 space-y-3">
                        <div class="flex items-center gap-2 justify-center">
                            <div class="h-3 w-3 bg-yellow-600 rounded-full"></div>
                            <div class="h-3 w-48 bg-yellow-600 rounded"></div>
                        </div>
                        
                        <!-- Button Edit -->
                        <div class="h-10 w-full bg-yellow-400 rounded shadow-sm flex items-center justify-center gap-2">
                             <div class="h-4 w-4 bg-yellow-700 rounded"></div>
                             <div class="h-4 w-24 bg-white/50 rounded"></div>
                        </div>

                        <div class="h-8 w-full bg-transparent flex flex-col gap-1 items-center">
                            <div class="h-2 w-full bg-gray-300 rounded"></div>
                            <div class="h-2 w-3/4 bg-gray-300 rounded"></div>
                        </div>
                    </div>

                     <!-- Status Box (Orange/Brown) -->
                    <div class="bg-orange-50 border border-orange-200 rounded p-3 flex items-center gap-2">
                        <div class="h-4 w-4 bg-orange-400 rounded-full"></div>
                        <div class="h-3 flex-1 bg-orange-300 rounded"></div>
                    </div>

                </div>

                <!-- Widget 2: Status Pesanan -->
                <div class="bg-white border border-gray-300 rounded-lg p-6 text-center">
                    <div class="h-3 w-24 bg-gray-400 rounded mx-auto mb-2"></div> <!-- Label Status -->
                    <div class="h-6 w-20 bg-yellow-200 rounded-full mx-auto mb-4"></div> <!-- Badge Pending -->
                    
                    <div class="h-3 w-40 bg-gray-400 rounded mx-auto mb-4"></div> <!-- Text Menunggu... -->
                    
                    <!-- Button Batal (Red Outline) -->
                    <div class="h-10 w-full border border-red-300 rounded text-red-500 flex items-center justify-center font-bold bg-white">
                        <div class="h-4 w-32 bg-red-100 rounded"></div>
                    </div>
                </div>

                <!-- Button Chat -->
                <div class="h-12 w-full border border-blue-500 rounded-lg flex items-center justify-center gap-2 bg-white">
                    <div class="h-5 w-5 bg-blue-500 rounded-full"></div>
                    <div class="h-4 w-24 bg-blue-500 rounded"></div>
                </div>

                <!-- Provider Profile Snippet -->
                <div class="bg-white border border-gray-300 rounded-lg p-4 flex items-center gap-3">
                     <div class="h-10 w-10 bg-gray-300 rounded-full"></div>
                     <div class="space-y-1">
                        <div class="h-3 w-24 bg-gray-600 rounded"></div>
                        <div class="h-2 w-16 bg-gray-400 rounded"></div>
                     </div>
                </div>

            </div>

        </div>
    </main>

</body>
</html>
