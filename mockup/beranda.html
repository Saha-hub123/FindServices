<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindServices Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pola garis untuk menandakan area gambar */
        .placeholder-image {
            background-image: repeating-linear-gradient(
                45deg,
                #e5e7eb,
                #e5e7eb 10px,
                #f3f4f6 10px,
                #f3f4f6 20px
            );
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-600 font-mono">

    <!-- NAVBAR WIREFRAME -->
    <nav class="bg-white border-b border-gray-300 fixed w-full z-50 top-0 h-16">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            
            <!-- Kiri: Logo & Search -->
            <div class="flex items-center gap-4 w-1/3">
                <div class="h-10 w-10 bg-gray-400 rounded-full flex items-center justify-center text-white text-xs">LOGO</div>
                <div class="hidden md:block w-full max-w-xs h-9 bg-gray-200 rounded-full border border-gray-300"></div>
            </div>

            <!-- Tengah: Navigasi -->
            <div class="flex justify-center flex-1 gap-8 h-full items-center">
                <div class="h-8 w-8 bg-gray-600 rounded"></div>
                <div class="h-8 w-8 bg-gray-200 rounded"></div>
                <div class="h-8 w-8 bg-gray-200 rounded"></div>
                <div class="h-8 w-8 bg-gray-200 rounded"></div>
            </div>

            <!-- Kanan: Profil -->
            <div class="flex items-center justify-end w-1/3 gap-3">
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-400 rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN LAYOUT -->
    <main class="max-w-7xl mx-auto px-4 pt-20 pb-10 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- SIDEBAR KIRI (3 Kolom) -->
        <aside class="hidden lg:block lg:col-span-3 space-y-6">
            <!-- Menu Utama -->
            <div class="bg-white border border-gray-300 p-4 rounded-lg space-y-4">
                <div class="h-10 bg-gray-200 rounded w-full"></div> <!-- Menu Aktif -->
                <div class="h-8 bg-gray-100 rounded w-3/4"></div>
                <div class="h-8 bg-gray-100 rounded w-3/4"></div>
            </div>

            <!-- Kategori List -->
            <div class="bg-white border border-gray-300 p-4 rounded-lg space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <div class="h-4 w-1/2 bg-gray-400 rounded"></div> <!-- Judul -->
                    <div class="h-3 w-1/4 bg-gray-200 rounded"></div> <!-- Link -->
                </div>
                <!-- Item List Loop -->
                <div class="space-y-3">
                    <div class="flex items-center gap-3">
                        <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
                        <div class="space-y-1 flex-1">
                            <div class="h-3 w-3/4 bg-gray-300 rounded"></div>
                            <div class="h-2 w-1/2 bg-gray-200 rounded"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
                        <div class="space-y-1 flex-1">
                            <div class="h-3 w-3/4 bg-gray-300 rounded"></div>
                            <div class="h-2 w-1/2 bg-gray-200 rounded"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
                        <div class="space-y-1 flex-1">
                            <div class="h-3 w-3/4 bg-gray-300 rounded"></div>
                            <div class="h-2 w-1/2 bg-gray-200 rounded"></div>
                        </div>
                    </div>
                     <div class="flex items-center gap-3">
                        <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
                        <div class="space-y-1 flex-1">
                            <div class="h-3 w-3/4 bg-gray-300 rounded"></div>
                            <div class="h-2 w-1/2 bg-gray-200 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- FEED TENGAH (6 Kolom) -->
        <section class="col-span-1 lg:col-span-6 space-y-6">
            
            <!-- Input Box -->
            <div class="bg-white border border-gray-300 p-4 rounded-lg">
                <div class="flex items-center gap-3 mb-4">
                    <div class="h-10 w-10 bg-gray-300 rounded-full"></div>
                    <div class="h-10 flex-1 bg-gray-100 rounded-full border border-gray-200"></div>
                </div>
                <div class="flex gap-2">
                    <div class="h-6 w-20 bg-gray-200 rounded-full"></div>
                    <div class="h-6 w-20 bg-gray-200 rounded-full"></div>
                    <div class="h-6 w-24 bg-gray-200 rounded-full"></div>
                </div>
            </div>

            <!-- Post Card 1 -->
            <article class="bg-white border border-gray-300 rounded-lg overflow-hidden">
                <!-- Header -->
                <div class="p-4 flex gap-3 items-center">
                    <div class="h-10 w-10 bg-gray-400 rounded-full"></div>
                    <div class="space-y-2">
                        <div class="h-3 w-32 bg-gray-500 rounded"></div>
                        <div class="h-2 w-48 bg-gray-300 rounded"></div>
                    </div>
                </div>
                
                <!-- Title & Price -->
                <div class="px-4 pb-2 space-y-2">
                    <div class="h-5 w-3/4 bg-gray-700 rounded"></div>
                    <div class="h-3 w-1/4 bg-gray-400 rounded"></div>
                </div>

                <!-- Image Placeholder -->
                <div class="w-full h-64 placeholder-image border-y border-gray-200 flex items-center justify-center text-gray-400 text-sm">
                    [AREA GAMBAR]
                </div>

                <!-- Footer / Action -->
                <div class="p-4 flex justify-between items-center bg-gray-50">
                    <div class="space-y-1">
                        <div class="h-2 w-16 bg-gray-300 rounded"></div>
                        <div class="h-6 w-24 bg-gray-800 rounded"></div>
                    </div>
                    <div class="h-10 w-32 bg-gray-600 rounded"></div> <!-- Button -->
                </div>
            </article>

            <!-- Post Card 2 -->
            <article class="bg-white border border-gray-300 rounded-lg overflow-hidden">
                <div class="p-4 flex gap-3 items-center">
                    <div class="h-10 w-10 bg-gray-400 rounded-full"></div>
                    <div class="space-y-2">
                        <div class="h-3 w-32 bg-gray-500 rounded"></div>
                        <div class="h-2 w-48 bg-gray-300 rounded"></div>
                    </div>
                </div>
                <div class="px-4 pb-4">
                    <div class="h-5 w-2/3 bg-gray-700 rounded"></div>
                </div>
            </article>
        </section>

        <!-- SIDEBAR KANAN (3 Kolom) -->
        <aside class="hidden lg:block lg:col-span-3 space-y-6">
            
            <!-- Widget 1 -->
            <div class="bg-white border border-gray-300 p-4 rounded-lg space-y-4">
                <div class="h-4 w-1/2 bg-gray-600 rounded mb-4"></div>
                
                <!-- List Items -->
                <div class="flex gap-3">
                    <div class="h-12 w-12 bg-gray-300 rounded"></div>
                    <div class="flex-1 space-y-2 py-1">
                        <div class="h-3 w-full bg-gray-400 rounded"></div>
                        <div class="h-2 w-1/2 bg-gray-200 rounded"></div>
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="h-12 w-12 bg-gray-300 rounded"></div>
                    <div class="flex-1 space-y-2 py-1">
                        <div class="h-3 w-full bg-gray-400 rounded"></div>
                        <div class="h-2 w-1/2 bg-gray-200 rounded"></div>
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="h-12 w-12 bg-gray-300 rounded"></div>
                    <div class="flex-1 space-y-2 py-1">
                        <div class="h-3 w-full bg-gray-400 rounded"></div>
                        <div class="h-2 w-1/2 bg-gray-200 rounded"></div>
                    </div>
                </div>
            </div>

            <!-- Widget 2 -->
            <div class="bg-white border border-gray-300 p-4 rounded-lg space-y-4">
                <div class="h-4 w-1/2 bg-gray-600 rounded mb-4"></div>
                
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
                        <div class="space-y-1">
                            <div class="h-2 w-16 bg-gray-500 rounded"></div>
                            <div class="h-1.5 w-10 bg-gray-300 rounded"></div>
                        </div>
                    </div>
                    <div class="h-6 w-12 bg-gray-200 rounded-full border border-gray-300"></div>
                </div>

                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
                        <div class="space-y-1">
                            <div class="h-2 w-16 bg-gray-500 rounded"></div>
                            <div class="h-1.5 w-10 bg-gray-300 rounded"></div>
                        </div>
                    </div>
                    <div class="h-6 w-12 bg-gray-200 rounded-full border border-gray-300"></div>
                </div>
            </div>

            <div class="text-xs text-gray-400 text-center">
                [Footer Links Area]
            </div>

        </aside>

    </main>

</body>
</html>
