<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindServices Chat Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .placeholder-image {
            background-image: repeating-linear-gradient(
                45deg,
                #e5e7eb,
                #e5e7eb 10px,
                #f3f4f6 10px,
                #f3f4f6 20px
            );
        }
        /* Custom scrollbar untuk chat area */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-600 font-mono h-screen flex flex-col overflow-hidden">

    <!-- NAVBAR WIREFRAME -->
    <nav class="bg-white border-b border-gray-300 flex-shrink-0 z-50 h-16">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            
            <!-- Kiri: Logo & Search -->
            <div class="flex items-center gap-4 w-1/3">
                <div class="h-10 w-10 bg-gray-400 rounded-full flex items-center justify-center text-white text-xs">LOGO</div>
                <div class="hidden md:block w-full max-w-xs h-9 bg-gray-200 rounded-full border border-gray-300"></div>
            </div>

            <!-- Tengah: Navigasi -->
            <div class="flex justify-center flex-1 gap-8 h-full items-end pb-0">
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
            </div>

            <!-- Kanan: Profil & Chat Notif -->
            <div class="flex items-center justify-end w-1/3 gap-3">
                <!-- Icon Chat dengan Notif -->
                <div class="relative">
                    <div class="h-9 w-9 bg-gray-600 rounded-full"></div> 
                    <div class="absolute -top-1 -right-1 h-4 w-4 bg-gray-800 border-2 border-white rounded-full flex items-center justify-center text-[8px] text-white">1</div>
                </div>
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-400 rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT (Full Height minus Navbar) -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-hidden">
        
        <!-- SIDEBAR KONTAK (Kiri) -->
        <aside class="hidden lg:flex lg:col-span-4 bg-white border border-gray-300 rounded-lg flex-col overflow-hidden h-full">
            
            <!-- Header Sidebar -->
            <div class="p-4 border-b border-gray-200">
                <div class="h-6 w-32 bg-gray-800 rounded mb-4"></div> <!-- Title: Percakapan -->
                <!-- Search Box -->
                <div class="h-10 w-full bg-gray-100 border border-gray-200 rounded-full flex items-center px-4 gap-2">
                    <div class="h-4 w-4 bg-gray-400 rounded-full"></div>
                    <div class="h-3 w-24 bg-gray-300 rounded"></div>
                </div>
            </div>

            <!-- List Kontak (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                
                <!-- Kontak 1 (Active) -->
                <div class="flex items-center gap-3 p-3 bg-blue-50 border-l-4 border-blue-500 rounded-r-lg cursor-pointer">
                    <div class="h-12 w-12 bg-gray-300 rounded-full flex-shrink-0"></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <div class="h-4 w-24 bg-gray-800 rounded"></div> <!-- Nama -->
                            <div class="h-3 w-8 bg-gray-400 rounded"></div> <!-- Jam -->
                        </div>
                        <div class="h-3 w-full bg-gray-400 rounded truncate"></div> <!-- Preview Chat -->
                    </div>
                </div>

                <!-- Kontak 2 (Unread) -->
                <div class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg cursor-pointer">
                    <div class="h-12 w-12 bg-gray-300 rounded-full flex-shrink-0 relative">
                         <div class="absolute bottom-0 right-0 h-3 w-3 bg-green-400 border-2 border-white rounded-full"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <div class="h-4 w-24 bg-gray-700 rounded"></div>
                            <div class="h-3 w-10 bg-gray-400 rounded"></div>
                        </div>
                        <div class="h-3 w-3/4 bg-gray-800 rounded font-bold"></div> <!-- Bold text -->
                    </div>
                    <div class="h-5 w-5 bg-red-500 rounded-full flex items-center justify-center text-[10px] text-white font-bold">1</div>
                </div>

                <!-- Kontak 3 -->
                <div class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg cursor-pointer">
                    <div class="h-12 w-12 bg-gray-300 rounded-full flex-shrink-0"></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <div class="h-4 w-20 bg-gray-700 rounded"></div>
                            <div class="h-3 w-10 bg-gray-400 rounded"></div>
                        </div>
                        <div class="h-3 w-1/2 bg-gray-300 rounded"></div>
                    </div>
                </div>

                <!-- Kontak 4 -->
                <div class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg cursor-pointer">
                    <div class="h-12 w-12 bg-gray-300 rounded-full flex-shrink-0"></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <div class="h-4 w-16 bg-gray-700 rounded"></div>
                            <div class="h-3 w-10 bg-gray-400 rounded"></div>
                        </div>
                        <div class="h-3 w-2/3 bg-gray-300 rounded"></div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- AREA CHAT (Kanan) -->
        <section class="col-span-1 lg:col-span-8 bg-white border border-gray-300 rounded-lg flex flex-col overflow-hidden h-full relative">
            
            <!-- Header Chat -->
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-white z-10">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-gray-300 rounded-full"></div>
                    <div>
                        <div class="h-4 w-32 bg-gray-800 rounded mb-1"></div> <!-- Nama -->
                        <div class="h-3 w-16 bg-gray-400 rounded"></div> <!-- Status Offline -->
                    </div>
                </div>
                <div class="h-8 w-2 bg-gray-400 rounded-full"></div> <!-- Kebab Menu -->
            </div>

            <!-- Context Bar (Booking Info) -->
            <div class="bg-blue-50 border-b border-blue-100 p-3 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 placeholder-image rounded bg-gray-200"></div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <div class="h-3 w-20 bg-blue-400 rounded"></div> <!-- "BOOKING #K55" -->
                            <div class="h-4 w-16 bg-yellow-200 rounded-full"></div> <!-- Status Badge -->
                        </div>
                        <div class="h-4 w-32 bg-gray-700 rounded"></div> <!-- Nama Jasa -->
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="h-8 w-16 bg-white border border-blue-200 rounded text-blue-400 flex items-center justify-center text-xs">Detail</div>
                    <div class="h-6 w-6 bg-gray-200 rounded-full flex items-center justify-center text-gray-500">x</div>
                </div>
            </div>

            <!-- Isi Chat (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-gray-50">
                
                <!-- Chat Bubble Kiri -->
                <div class="flex flex-col items-start max-w-[70%]">
                    <div class="bg-white border border-gray-200 p-3 rounded-lg rounded-tl-none shadow-sm mb-1">
                        <div class="h-4 w-12 bg-gray-600 rounded"></div>
                    </div>
                    <div class="h-3 w-16 bg-gray-300 rounded self-start ml-1"></div> <!-- Timestamp -->
                </div>

                <!-- Spacer Date -->
                <div class="flex justify-center my-4">
                    <div class="h-6 w-24 bg-gray-200 rounded-full flex items-center justify-center text-xs text-gray-500">Hari ini</div>
                </div>

                <!-- Chat Bubble Kanan (Deleted Messages) -->
                <div class="flex flex-col items-end w-full space-y-2">
                    
                    <div class="flex flex-col items-end max-w-[70%] opacity-60">
                        <div class="bg-gray-100 border border-gray-200 p-3 rounded-lg rounded-tr-none flex items-center gap-2">
                            <div class="h-4 w-4 bg-gray-400 rounded-full"></div> <!-- Icon Block -->
                            <div class="h-4 w-32 bg-gray-400 rounded italic"></div> <!-- Text "Pesan dihapus" -->
                        </div>
                        <div class="h-3 w-16 bg-gray-300 rounded mt-1"></div>
                    </div>

                    <div class="flex flex-col items-end max-w-[70%] opacity-60">
                         <div class="bg-gray-100 border border-gray-200 p-3 rounded-lg rounded-tr-none flex items-center gap-2">
                            <div class="h-4 w-4 bg-gray-400 rounded-full"></div> 
                            <div class="h-4 w-32 bg-gray-400 rounded italic"></div> 
                        </div>
                        <div class="h-3 w-16 bg-gray-300 rounded mt-1"></div>
                    </div>

                    <!-- Chat Bubble Kanan (Normal) -->
                    <div class="flex flex-col items-end max-w-[70%]">
                        <div class="bg-blue-600 p-3 rounded-lg rounded-tr-none shadow-sm mb-1 text-white">
                            <div class="h-4 w-8 bg-white/90 rounded"></div> <!-- "hai" -->
                        </div>
                        <div class="h-3 w-16 bg-gray-300 rounded flex items-center justify-end gap-1">
                             <span class="w-3 h-3 bg-blue-400 rounded-full"></span> <!-- Read check -->
                        </div>
                    </div>

                    <!-- Chat Bubble Kanan (Complex / With Context) -->
                    <div class="flex flex-col items-end max-w-[75%]">
                        <div class="bg-blue-600 p-2 rounded-lg rounded-tr-none shadow-sm mb-1 w-full text-white">
                            
                            <!-- Internal Context Box -->
                            <div class="bg-blue-700/50 p-2 rounded mb-2 border-l-4 border-yellow-400 flex flex-col gap-1">
                                <div class="h-3 w-20 bg-blue-200/50 rounded"></div> <!-- BOOKING #K55 -->
                                <div class="h-4 w-32 bg-white rounded"></div> <!-- Beauty Salon -->
                            </div>
                            
                            <!-- Message Text -->
                            <div class="h-4 w-full bg-white/90 rounded mb-1"></div>
                            <div class="h-4 w-2/3 bg-white/90 rounded"></div>
                            
                            <div class="flex justify-end mt-2">
                                <div class="h-3 w-10 bg-blue-300 rounded"></div> <!-- Time -->
                            </div>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Footer Input -->
            <div class="p-4 bg-white border-t border-gray-200">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-gray-200 rounded hover:bg-gray-300 cursor-pointer flex items-center justify-center">
                        <div class="h-5 w-5 bg-gray-400 rounded"></div> <!-- Icon Image -->
                    </div>
                    <div class="flex-1 h-10 bg-gray-100 rounded-full px-4 flex items-center border border-gray-200">
                        <div class="h-4 w-32 bg-gray-300 rounded"></div> <!-- Placeholder "Ketik pesan..." -->
                    </div>
                    <div class="h-10 w-10 bg-blue-600 rounded-full flex items-center justify-center cursor-pointer hover:bg-blue-700">
                        <div class="h-5 w-5 bg-white transform -rotate-45 rounded-sm origin-center"></div> <!-- Icon Send Arrow -->
                    </div>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
