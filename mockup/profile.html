<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindServices Profile Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .placeholder-image {
            background-image: repeating-linear-gradient(
                45deg,
                #e5e7eb,
                #e5e7eb 10px,
                #f3f4f6 10px,
                #f3f4f6 20px
            );
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-600 font-mono">

    <!-- NAVBAR WIREFRAME -->
    <nav class="bg-white border-b border-gray-300 fixed w-full z-50 top-0 h-16">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            
            <!-- Kiri: Logo & Search -->
            <div class="flex items-center gap-4 w-1/3">
                <div class="h-10 w-10 bg-gray-400 rounded-full flex items-center justify-center text-white text-xs">LOGO</div>
                <div class="hidden md:block w-full max-w-xs h-9 bg-gray-200 rounded-full border border-gray-300"></div>
            </div>

            <!-- Tengah: Navigasi (Icon ke-4 Aktif - Profil) -->
            <div class="flex justify-center flex-1 gap-8 h-full items-end pb-0">
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <!-- Menu Profil Aktif -->
                <div class="h-full flex flex-col justify-end items-center gap-3 pt-4 border-b-4 border-gray-600 px-2">
                    <div class="h-8 w-8 bg-gray-600 rounded"></div>
                </div>
            </div>

            <!-- Kanan: Profil -->
            <div class="flex items-center justify-end w-1/3 gap-3">
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-400 rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN LAYOUT -->
    <main class="max-w-5xl mx-auto px-4 pt-24 pb-10">
        
        <!-- HEADER PROFIL -->
        <section class="bg-white border border-gray-300 rounded-lg p-8 mb-8">
            <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
                
                <!-- Foto Profil Besar -->
                <div class="h-40 w-40 rounded-full placeholder-image border-4 border-white shadow-sm flex-shrink-0"></div>

                <!-- Info User -->
                <div class="flex-1 space-y-4 w-full text-center md:text-left">
                    
                    <!-- Baris Nama & Tombol -->
                    <div class="flex flex-col md:flex-row items-center gap-4">
                        <div class="h-8 w-48 bg-gray-800 rounded"></div> <!-- Nama -->
                        <div class="h-9 w-28 bg-white border border-gray-400 rounded flex items-center justify-center gap-2">
                            <div class="h-4 w-4 bg-gray-400 rounded"></div>
                            <div class="h-3 w-16 bg-gray-300 rounded"></div>
                        </div> <!-- Tombol Edit -->
                        <div class="h-9 w-9 bg-white border border-gray-400 rounded flex items-center justify-center">
                            <div class="h-5 w-5 bg-gray-400 rounded"></div>
                        </div> <!-- Tombol Setting -->
                    </div>

                    <!-- Baris Statistik -->
                    <div class="flex items-center justify-center md:justify-start gap-6 text-sm">
                        <div class="flex items-center gap-1">
                            <span class="h-4 w-4 bg-gray-800 inline-block rounded"></span>
                            <span class="h-3 w-10 bg-gray-400 inline-block rounded"></span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="h-4 w-4 bg-gray-800 inline-block rounded"></span>
                            <span class="h-3 w-24 bg-gray-400 inline-block rounded"></span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="h-4 w-4 bg-gray-800 inline-block rounded"></span>
                            <span class="h-3 w-20 bg-gray-400 inline-block rounded"></span>
                        </div>
                    </div>

                    <!-- Bio -->
                    <div class="space-y-2 max-w-2xl mx-auto md:mx-0">
                        <div class="h-3 w-full bg-gray-300 rounded"></div>
                        <div class="h-3 w-3/4 bg-gray-300 rounded"></div>
                    </div>

                    <!-- Lokasi -->
                    <div class="flex items-center justify-center md:justify-start gap-2 pt-2">
                        <div class="h-4 w-4 bg-red-400 rounded-full"></div> <!-- Pin Icon -->
                        <div class="h-3 w-20 bg-gray-500 rounded"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- TABS NAVIGASI -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b border-gray-300 mb-6 gap-4">
            
            <!-- Tab Links -->
            <div class="flex gap-8">
                <div class="pb-3 border-b-2 border-gray-800 flex items-center gap-2 px-2">
                    <div class="h-4 w-4 bg-gray-800 rounded"></div>
                    <div class="h-4 w-24 bg-gray-800 rounded"></div> <!-- Etalase Jasa -->
                </div>
                <div class="pb-3 border-b-2 border-transparent flex items-center gap-2 px-2">
                    <div class="h-4 w-4 bg-gray-400 rounded"></div>
                    <div class="h-4 w-16 bg-gray-400 rounded"></div> <!-- Review -->
                </div>
                <div class="pb-3 border-b-2 border-transparent px-2">
                    <div class="h-5 w-5 bg-gray-400 rounded"></div> <!-- Trash Icon -->
                </div>
            </div>

            <!-- View Toggle -->
            <div class="flex items-center gap-1 bg-white border border-gray-300 rounded p-1 mb-2 md:mb-0">
                <div class="h-7 w-7 bg-gray-300 rounded"></div>
                <div class="h-7 w-7 bg-gray-100 rounded"></div>
            </div>
        </div>

        <!-- GRID ETALASE -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- Card 1: Tambah Jasa (Dashed Border) -->
            <div class="border-2 border-dashed border-gray-300 rounded-lg h-full min-h-[320px] flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-50 transition bg-white">
                <div class="h-12 w-12 bg-gray-200 rounded-full flex items-center justify-center mb-3">
                    <div class="h-6 w-1 bg-gray-400 rounded absolute"></div>
                    <div class="h-1 w-6 bg-gray-400 rounded absolute"></div>
                </div>
                <div class="h-4 w-32 bg-gray-500 rounded mb-1"></div>
                <div class="h-3 w-20 bg-gray-400 rounded"></div>
            </div>

            <!-- Card 2: Jasa Item -->
            <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                <div class="w-full h-48 placeholder-image relative p-3">
                    <div class="absolute top-3 left-3 h-6 w-32 bg-gray-700/80 rounded"></div>
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                    <div>
                        <div class="h-6 w-24 bg-gray-800 rounded mb-2"></div>
                        <div class="h-4 w-3/4 bg-gray-600 rounded mb-4"></div>
                        <div class="flex items-center gap-2">
                            <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                            <div class="h-2 w-20 bg-gray-300 rounded"></div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                        <div class="flex items-center gap-2">
                            <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                            <div class="h-2 w-16 bg-gray-500 rounded"></div>
                        </div>
                        <div class="h-4 w-10 bg-yellow-100 border border-yellow-200 rounded"></div>
                    </div>
                </div>
            </div>

            <!-- Card 3: Jasa Item -->
            <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                <div class="w-full h-48 placeholder-image relative p-3">
                    <div class="absolute top-3 left-3 h-6 w-16 bg-gray-700/80 rounded"></div>
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                    <div>
                        <div class="h-6 w-20 bg-gray-800 rounded mb-2"></div>
                        <div class="h-4 w-full bg-gray-600 rounded mb-4"></div>
                        <div class="flex items-center gap-2">
                            <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                            <div class="h-2 w-16 bg-gray-300 rounded"></div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                        <div class="flex items-center gap-2">
                            <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                            <div class="h-2 w-16 bg-gray-500 rounded"></div>
                        </div>
                        <div class="h-4 w-8 bg-yellow-100 border border-yellow-200 rounded"></div>
                    </div>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
