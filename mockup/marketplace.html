<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindServices Marketplace Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pola garis untuk menandakan area gambar */
        .placeholder-image {
            background-image: repeating-linear-gradient(
                45deg,
                #e5e7eb,
                #e5e7eb 10px,
                #f3f4f6 10px,
                #f3f4f6 20px
            );
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-600 font-mono">

    <!-- NAVBAR WIREFRAME -->
    <nav class="bg-white border-b border-gray-300 fixed w-full z-50 top-0 h-16">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            
            <!-- Kiri: Logo & Search -->
            <div class="flex items-center gap-4 w-1/3">
                <div class="h-10 w-10 bg-gray-400 rounded-full flex items-center justify-center text-white text-xs">LOGO</div>
                <div class="hidden md:block w-full max-w-xs h-9 bg-gray-200 rounded-full border border-gray-300"></div>
            </div>

            <!-- Tengah: Navigasi (Icon ke-2 Aktif) -->
            <div class="flex justify-center flex-1 gap-8 h-full items-end pb-0">
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <!-- Menu Toko Aktif -->
                <div class="h-full flex flex-col justify-end items-center gap-3 pt-4 border-b-4 border-gray-600 px-2">
                    <div class="h-8 w-8 bg-gray-600 rounded"></div>
                </div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
                <div class="h-8 w-8 bg-gray-200 rounded mb-4"></div>
            </div>

            <!-- Kanan: Profil -->
            <div class="flex items-center justify-end w-1/3 gap-3">
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-200 rounded-full"></div>
                <div class="h-9 w-9 bg-gray-400 rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN LAYOUT -->
    <main class="max-w-7xl mx-auto px-4 pt-24 pb-10 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- SIDEBAR FILTER (Kiri - 3 Kolom) -->
        <aside class="hidden lg:block lg:col-span-3">
            <div class="bg-white border border-gray-300 p-5 rounded-lg space-y-6 sticky top-24">
                
                <!-- Header Filter -->
                <div class="flex items-center gap-2 mb-2">
                    <div class="h-5 w-5 bg-gray-600 rounded"></div> <!-- Icon Filter -->
                    <div class="h-5 w-16 bg-gray-800 rounded"></div> <!-- Text Filter -->
                </div>
                
                <hr class="border-gray-200">

                <!-- Kata Kunci -->
                <div class="space-y-2">
                    <div class="h-3 w-20 bg-gray-400 rounded"></div>
                    <div class="h-10 w-full bg-white border border-gray-300 rounded flex items-center px-3 gap-2">
                        <div class="h-4 w-4 bg-gray-300 rounded-full"></div>
                        <div class="h-2 w-24 bg-gray-100 rounded"></div>
                    </div>
                </div>

                <!-- Rentang Harga -->
                <div class="space-y-2">
                    <div class="h-3 w-24 bg-gray-400 rounded"></div>
                    <div class="h-10 w-full bg-white border border-gray-300 rounded flex items-center px-3 gap-2">
                        <div class="h-3 w-4 bg-gray-300 rounded">Rp</div>
                        <div class="h-2 w-10 bg-gray-100 rounded"></div>
                    </div>
                    <div class="h-10 w-full bg-white border border-gray-300 rounded flex items-center px-3 gap-2">
                        <div class="h-3 w-4 bg-gray-300 rounded">Rp</div>
                        <div class="h-2 w-10 bg-gray-100 rounded"></div>
                    </div>
                </div>

                <!-- Rating Service -->
                <div class="space-y-3">
                    <div class="h-3 w-24 bg-gray-400 rounded"></div>
                    <!-- Stars Row 1 -->
                    <div class="flex items-center gap-2">
                        <div class="h-4 w-4 rounded-full border border-gray-300"></div>
                        <div class="flex gap-1">
                            <div class="h-3 w-3 bg-gray-300 rounded"></div>
                            <div class="h-3 w-3 bg-gray-300 rounded"></div>
                            <div class="h-3 w-3 bg-gray-300 rounded"></div>
                            <div class="h-3 w-3 bg-gray-300 rounded"></div>
                            <div class="h-3 w-3 bg-gray-200 rounded"></div>
                        </div>
                        <div class="h-2 w-8 bg-gray-400 rounded"></div>
                    </div>
                     <!-- Stars Row 2 -->
                     <div class="flex items-center gap-2">
                        <div class="h-4 w-4 rounded-full border border-gray-300"></div>
                        <div class="flex gap-1">
                            <div class="h-3 w-3 bg-gray-300 rounded"></div>
                            <div class="h-3 w-3 bg-gray-300 rounded"></div>
                            <div class="h-3 w-3 bg-gray-300 rounded"></div>
                            <div class="h-3 w-3 bg-gray-200 rounded"></div>
                            <div class="h-3 w-3 bg-gray-200 rounded"></div>
                        </div>
                        <div class="h-2 w-8 bg-gray-400 rounded"></div>
                    </div>
                </div>

                <!-- Lokasi -->
                <div class="space-y-2">
                    <div class="h-3 w-24 bg-gray-400 rounded"></div>
                    <div class="h-10 w-full bg-white border border-gray-300 rounded flex items-center px-3 gap-2">
                        <div class="h-4 w-4 bg-gray-400 rounded-full"></div> <!-- Pin Icon -->
                        <div class="h-2 w-32 bg-gray-100 rounded"></div>
                    </div>
                </div>

                 <!-- Kategori -->
                 <div class="space-y-2 pt-2">
                    <div class="h-3 w-16 bg-gray-400 rounded mb-3"></div>
                    <div class="h-10 w-full bg-blue-50 border-l-4 border-blue-400 flex items-center px-3">
                        <div class="h-3 w-24 bg-blue-300 rounded"></div>
                    </div>
                    <div class="h-10 w-full flex items-center px-3">
                        <div class="h-3 w-32 bg-gray-300 rounded"></div>
                    </div>
                    <div class="h-10 w-full flex items-center px-3">
                        <div class="h-3 w-28 bg-gray-300 rounded"></div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- KONTEN UTAMA (Kanan - 9 Kolom) -->
        <section class="col-span-1 lg:col-span-9 space-y-6">
            
            <!-- Header Section -->
            <div class="mb-6">
                <div class="h-8 w-64 bg-gray-800 rounded mb-2"></div> <!-- Title: Marketplace Jasa -->
                <div class="h-4 w-48 bg-gray-400 rounded"></div> <!-- Subtitle -->
            </div>

            <!-- GRID ITEMS -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                <!-- Card 1 -->
                <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                    <div class="w-full h-48 placeholder-image relative p-3">
                        <div class="absolute top-3 left-3 h-6 w-32 bg-gray-700/80 rounded"></div> <!-- Kategori Badge -->
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="h-6 w-24 bg-gray-800 rounded mb-2"></div> <!-- Harga -->
                            <div class="h-4 w-3/4 bg-gray-600 rounded mb-4"></div> <!-- Judul -->
                            <div class="flex items-center gap-2">
                                <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-20 bg-gray-300 rounded"></div> <!-- Lokasi -->
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <div class="flex items-center gap-2">
                                <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-16 bg-gray-500 rounded"></div>
                            </div>
                            <div class="h-4 w-10 bg-yellow-100 border border-yellow-200 rounded"></div> <!-- Rating/New Badge -->
                        </div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                    <div class="w-full h-48 placeholder-image relative p-3">
                        <div class="absolute top-3 left-3 h-6 w-32 bg-gray-700/80 rounded"></div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="h-6 w-32 bg-gray-800 rounded mb-2"></div> <!-- Harga Panjang -->
                            <div class="h-4 w-2/3 bg-gray-600 rounded mb-4"></div>
                            <div class="flex items-center gap-2">
                                <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-24 bg-gray-300 rounded"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <div class="flex items-center gap-2">
                                <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-10 bg-gray-500 rounded"></div>
                            </div>
                            <div class="h-4 w-10 bg-yellow-100 border border-yellow-200 rounded"></div>
                        </div>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                    <div class="w-full h-48 placeholder-image relative p-3">
                        <div class="absolute top-3 left-3 h-6 w-16 bg-gray-700/80 rounded"></div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="h-6 w-20 bg-gray-800 rounded mb-2"></div>
                            <div class="h-4 w-full bg-gray-600 rounded mb-4"></div>
                            <div class="flex items-center gap-2">
                                <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-16 bg-gray-300 rounded"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <div class="flex items-center gap-2">
                                <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-16 bg-gray-500 rounded"></div>
                            </div>
                            <div class="h-4 w-8 bg-yellow-100 border border-yellow-200 rounded"></div>
                        </div>
                    </div>
                </div>

                <!-- Card 4 -->
                <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                    <div class="w-full h-48 placeholder-image relative p-3">
                        <div class="absolute top-3 left-3 h-6 w-16 bg-gray-700/80 rounded"></div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="h-6 w-24 bg-gray-800 rounded mb-2"></div>
                            <div class="h-4 w-3/4 bg-gray-600 rounded mb-4"></div>
                            <div class="flex items-center gap-2">
                                <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-20 bg-gray-300 rounded"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <div class="flex items-center gap-2">
                                <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-12 bg-gray-500 rounded"></div>
                            </div>
                            <div class="h-4 w-10 bg-gray-200 rounded"></div>
                        </div>
                    </div>
                </div>

                <!-- Card 5 -->
                <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                    <div class="w-full h-48 placeholder-image relative p-3">
                        <div class="absolute top-3 left-3 h-6 w-16 bg-gray-700/80 rounded"></div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="h-6 w-20 bg-gray-800 rounded mb-2"></div>
                            <div class="h-4 w-full bg-gray-600 rounded mb-4"></div>
                            <div class="flex items-center gap-2">
                                <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-24 bg-gray-300 rounded"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <div class="flex items-center gap-2">
                                <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-16 bg-gray-500 rounded"></div>
                            </div>
                            <div class="h-4 w-10 bg-gray-200 rounded"></div>
                        </div>
                    </div>
                </div>

                <!-- Card 6 -->
                <div class="bg-white border border-gray-300 rounded-lg overflow-hidden flex flex-col">
                    <div class="w-full h-48 placeholder-image relative p-3">
                        <div class="absolute top-3 left-3 h-6 w-32 bg-gray-700/80 rounded"></div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="h-6 w-20 bg-gray-800 rounded mb-2"></div>
                            <div class="h-4 w-2/3 bg-gray-600 rounded mb-4"></div>
                            <div class="flex items-center gap-2">
                                <div class="h-3 w-3 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-16 bg-gray-300 rounded"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <div class="flex items-center gap-2">
                                <div class="h-6 w-6 bg-gray-400 rounded-full"></div>
                                <div class="h-2 w-16 bg-gray-500 rounded"></div>
                            </div>
                            <div class="h-4 w-10 bg-gray-200 rounded"></div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

</body>
</html>
